name: CI triage

# When a workflow below fails, Claude diagnoses it (read-only) and files a `ci-triage` issue.
# Shared logic + plan: Collective-Shared .github/workflows/ci-triage.yml, plans/2026-11-12-ci-auto-triage.md
# Add new workflows' names here so their failures are triaged too.
on:
  workflow_run:
    workflows:
      - "Accent-drift experiment"
      - "Audio fidelity audit (Whisper + Vosk)"
      - "Find Voices"
      - "Generate Audiobook"
      - "Narration A/B (publish to website)"
      - "Pad chapter-end silence (0 credits)"
      - "Rebuild Timestamps (no TTS)"
      - "Eleven v4 probe (no audiobook writes)"
      - "Voice Compare (publish to website)"
      - "Voice Test Samples"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write
  id-token: write

jobs:
  triage:
    if: github.event.workflow_run.conclusion == 'failure'
    uses: Noble-Collective/Collective-Shared/.github/workflows/ci-triage.yml@main
    secrets: inherit
