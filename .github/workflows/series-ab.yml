name: Series narration A/B (publish to website)

# One passage of a series book in one voice on two models: A = multilingual v2 as series books
# ship today, B = Eleven v4 at its own pace, B2 = B slowed to the series pace (0 credits).
# Published to GCS voice-test/{slug}/ and served at /voice-test/{slug}. Writes nothing else.
# See src/series-ab.js. DRY_RUN prints every version's spoken text without spending credits.

on:
  workflow_dispatch:
    inputs:
      session:
        description: 'Session file, path in the resources repo'
        required: true
      from:
        description: 'Heading line where the passage starts (exact)'
        required: true
      until:
        description: 'Heading line where it stops (excluded; empty = end of file)'
        required: false
        default: ''
      prefix:
        description: 'Markdown put before the passage (e.g. the session H1)'
        required: false
        default: ''
      slug:
        description: 'Page slug (/voice-test/<slug>)'
        required: true
      title:
        description: 'Page title'
        required: true
      subtitle:
        description: 'Page subtitle'
        required: false
        default: 'Narration A/B · v2 vs v4'
      voice_id:
        description: 'ElevenLabs voice (default Ollie)'
        required: false
        default: 'jRAAK67SEFE9m7ci5DhD'
      variants:
        description: 'Versions (A = v2, B = v4, B2 = v4 slowed)'
        required: false
        default: 'A,B,B2'
      dry_run:
        description: 'Print spoken text only, no TTS spend'
        required: false
        default: 'true'
      force:
        description: 'Re-render versions that already exist in GCS'
        required: false
        default: 'false'

concurrency:
  group: model-ab
  cancel-in-progress: false

jobs:
  series-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audiobook tooling
        uses: actions/checkout@v5

      - name: Checkout resources content
        uses: actions/checkout@v5
        with:
          repository: Noble-Collective/Noble-Imprint-Resources
          token: ${{ secrets.RESOURCES_TOKEN }}
          path: resources

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Render and publish
        run: node src/series-ab.js
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GCS_BUCKET: noble-imprint-audiobooks
          RESOURCES_PATH: resources
          SESSION: ${{ github.event.inputs.session }}
          FROM: ${{ github.event.inputs.from }}
          UNTIL: ${{ github.event.inputs.until }}
          PREFIX: ${{ github.event.inputs.prefix }}
          SLUG: ${{ github.event.inputs.slug }}
          TITLE: ${{ github.event.inputs.title }}
          SUBTITLE: ${{ github.event.inputs.subtitle }}
          VOICE_ID: ${{ github.event.inputs.voice_id }}
          VARIANTS: ${{ github.event.inputs.variants }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}

      - name: Refresh website audio cache
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          REFRESH_SECRET: ${{ secrets.REFRESH_SECRET }}
        run: |
          curl -s -X POST -H "x-refresh-key: $REFRESH_SECRET" https://nobleimprint.com/api/refresh-audio || true
